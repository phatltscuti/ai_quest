<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 15px;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 18px;
      text-align: center;
    }
    .toggle-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .toggle-container:last-child {
      border-bottom: none;
    }
    .toggle-label {
      font-size: 14px;
      font-weight: 500;
    }
    .toggle-switch {
      position: relative;
      width: 50px;
      height: 24px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #4CAF50;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    .status {
      margin-top: 15px;
      padding: 10px;
      background-color: #f5f5f5;
      border-radius: 5px;
      font-size: 12px;
      text-align: center;
      color: #666;
    }
    .status.active {
      background-color: #e8f5e9;
      color: #2e7d32;
    }
    .main-toggle {
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 2px solid #ddd;
    }
  </style>
</head>
<body>
  <h3>NREER Auto Click</h3>
  
  <div class="main-toggle">
    <div class="toggle-container">
      <span class="toggle-label">Enable Extension</span>
      <label class="toggle-switch">
        <input type="checkbox" id="toggleButton">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="toggle-container">
    <span class="toggle-label">❤️ Auto Hearts</span>
    <label class="toggle-switch">
      <input type="checkbox" id="toggleHearts" data-type="hearts">
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-container">
    <span class="toggle-label">▶️ Auto Views</span>
    <label class="toggle-switch">
      <input type="checkbox" id="toggleViews" data-type="views">
      <span class="slider"></span>
    </label>
  </div>

  <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee;">
    <label style="font-size: 12px; color: #666; display: block; margin-bottom: 5px;">Video URL (optional):</label>
    <input type="text" id="videoUrl" placeholder="Enter video URL" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; box-sizing: border-box;">
    <button id="saveUrl" style="width: 100%; margin-top: 8px; padding: 6px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">Save URL</button>
  </div>

  <div class="status" id="status">Extension is OFF</div>

  <script src="popup.js"></script>
</body>
</html>
