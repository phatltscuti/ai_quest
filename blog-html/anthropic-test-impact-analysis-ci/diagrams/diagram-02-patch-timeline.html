<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Why patches stopped working</title>
<style>
body{margin:0;background:#fafafa;font-family:'Segoe UI',Roboto,Arial,sans-serif}
#canvas{width:1400px;padding:24px;box-sizing:border-box}
</style></head><body>
<div id="canvas">
<svg width="1352" height="620" viewBox="0 0 1352 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <rect width="1352" height="620" fill="#fff" rx="16" stroke="#e0e0e0"/>
  <text x="676" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0d47a1">Agentic load vs. how long each fix lasted</text>
  <text x="676" y="72" text-anchor="middle" font-size="15" fill="#616161">Numbers quoted from the Anthropic article; layout is the author's own.</text>

  <!-- load multipliers -->
  <text x="60" y="122" font-size="18" font-weight="700" fill="#333">Pressure on CI (source figures)</text>
  <g font-size="15">
    <text x="60" y="162" fill="#333">Code shipped per engineer / quarter</text>
    <rect x="380" y="146" width="128" height="22" rx="4" fill="#90caf9"/>
    <text x="518" y="163" font-weight="700" fill="#0d47a1">8x  (vs 2021–2025)</text>
    <text x="60" y="198" fill="#333">Tests in the codebase</text>
    <rect x="380" y="182" width="160" height="22" rx="4" fill="#64b5f6"/>
    <text x="550" y="199" font-weight="700" fill="#0d47a1">10x</text>
    <text x="60" y="234" fill="#333">CI jobs (6 months)</text>
    <rect x="380" y="218" width="400" height="22" rx="4" fill="#1565c0"/>
    <text x="790" y="235" font-weight="700" fill="#0d47a1">25x</text>
    <text x="60" y="270" fill="#333">Authored by Claude</text>
    <text x="380" y="271" font-weight="700" fill="#00695c">80% of that code (share, not a multiplier)</text>
  </g>
  <text x="900" y="160" font-size="14" fill="#616161">Why jobs grow faster than code:</text>
  <text x="900" y="184" font-size="14" fill="#333">• agents prefer smaller, granular PRs</text>
  <text x="900" y="206" font-size="14" fill="#333">• more agents per engineer</text>
  <text x="900" y="228" font-size="14" fill="#333">• agents push overnight &amp; weekends</text>
  <text x="900" y="250" font-size="14" fill="#333">• still bursty when humans approve</text>

  <!-- timeline -->
  <text x="60" y="330" font-size="18" font-weight="700" fill="#333">Fixes and how much time each one bought</text>
  <line x1="80" y1="440" x2="1280" y2="440" stroke="#90a4ae" stroke-width="3"/>

  <g>
    <circle cx="160" cy="440" r="12" fill="#2e7d32"/>
    <text x="160" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#333">Oct 2025</text>
    <text x="160" y="478" text-anchor="middle" font-size="15" font-weight="700" fill="#2e7d32">Patch 1</text>
    <text x="160" y="500" text-anchor="middle" font-size="13" fill="#333">double the cores</text>
    <rect x="172" y="430" width="420" height="20" rx="4" fill="#a5d6a7" opacity=".7"/>
    <text x="382" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">lasted ~70 days</text>
  </g>
  <g>
    <circle cx="600" cy="440" r="12" fill="#f57f17"/>
    <text x="600" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#333">Feb</text>
    <text x="600" y="478" text-anchor="middle" font-size="15" font-weight="700" fill="#f57f17">Patch 2</text>
    <text x="600" y="500" text-anchor="middle" font-size="13" fill="#333">shard: 1 writer</text>
    <text x="600" y="518" text-anchor="middle" font-size="13" fill="#333">per package</text>
    <rect x="612" y="430" width="174" height="20" rx="4" fill="#ffcc80" opacity=".8"/>
    <text x="699" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#e65100">29 days</text>
  </g>
  <g>
    <circle cx="800" cy="440" r="12" fill="#c62828"/>
    <text x="800" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#333">Mar</text>
    <text x="800" y="478" text-anchor="middle" font-size="15" font-weight="700" fill="#c62828">Patch 3</text>
    <text x="800" y="500" text-anchor="middle" font-size="13" fill="#333">daily restarts</text>
    <text x="800" y="518" text-anchor="middle" font-size="13" fill="#c62828">&lt; 1 day, falls behind</text>
  </g>
  <g>
    <rect x="930" y="414" width="300" height="52" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="1080" y="438" text-anchor="middle" font-size="16" font-weight="700" fill="#1b5e20">Redesign: stateless + store</text>
    <text x="1080" y="458" text-anchor="middle" font-size="13" fill="#333">3 weeks · 1 engineer (≈ a quarter a year ago)</text>
    <text x="1080" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">backlog flat, stable since</text>
  </g>

  <rect x="60" y="550" width="1232" height="48" rx="10" fill="#fffbe6" stroke="#f5c542"/>
  <text x="676" y="580" text-anchor="middle" font-size="16" fill="#333"><tspan font-weight="700">Lesson:</tspan> under exponential load, each half-measure buys less time — while a full redesign now costs far less because writing code is no longer the bottleneck.</text>
</svg>
</div>
</body></html>
