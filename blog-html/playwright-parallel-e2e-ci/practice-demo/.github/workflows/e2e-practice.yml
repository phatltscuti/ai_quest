name: E2E Practice Matrix

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-full:
    if: contains(github.event.head_commit.message, '[e2e-full]') || startsWith(github.event_name, 'workflow_')
    strategy:
      fail-fast: false
      matrix:
        project:
          - light-r1-document
          - heavy-r1-document
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-html/playwright-parallel-e2e-ci/practice-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: blog-html/playwright-parallel-e2e-ci/practice-demo/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run project
        run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: "true"

  e2e-impact:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-html/playwright-parallel-e2e-ci/practice-demo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Resolve and run impact specs
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- "app/*" "e2e/*" || true)
          if [ -z "$CHANGED" ]; then
            echo "No relevant changes; running light suite as smoke."
            npx playwright test --project=light-r1-document
          else
            echo "Changed files:"
            echo "$CHANGED"
            node scripts/run-impact.js $CHANGED
          fi
        env:
          CI: "true"
